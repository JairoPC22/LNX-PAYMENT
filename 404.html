<!doctype html>
<html lang="es" class="no-js">
<head>
  <script>document.documentElement.classList.remove('no-js');</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LNX Technologies - Página no encontrada</title>
  <meta name="description" content="La página que buscas no existe o fue movida." />
  <meta name="robots" content="noindex" />

  <meta name="theme-color" content="#f3f4f5" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#050f1f" media="(prefers-color-scheme: dark)" />

  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
  <link rel="manifest" href="manifest.json" />

  <link rel="stylesheet" href="css/styles.css" />
</head>
<body id="top">
  <div id="header-sentinel" aria-hidden="true"></div>
  <a class="skip-link" href="#main" data-i18n="a11y.skipLink">Saltar al contenido</a>

  <header class="site-header">
    <div class="container">
      <a class="brand-logo" href="index.html" aria-label="LNX Technologies">
        <img
          class="js-brand-logo"
          src="assets/brand/lnx-logo-light.svg"
          data-src-light="assets/brand/lnx-logo-light.svg"
          data-src-dark="assets/brand/lnx-logo-dark.svg"
          alt="LNX Technologies"
          width="160"
          height="62"
        />
      </a>

      <div class="header-controls">
        <div class="control-cluster">
          <div class="lang-switch" role="group" aria-label="Selector de idioma">
            <button type="button" data-locale="es" aria-pressed="true" data-i18n-attr="aria-label:a11y.langEs">ES</button>
            <button type="button" data-locale="en" aria-pressed="false" data-i18n-attr="aria-label:a11y.langEn">EN</button>
          </div>
          <span class="control-divider" aria-hidden="true"></span>
          <button type="button" class="theme-toggle" aria-pressed="false" data-i18n-attr="aria-label:a11y.themeToDark">
            <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
              <circle cx="12" cy="12" r="4.2" />
              <path d="M12 2.5v2.4M12 19.1v2.4M4.2 4.2l1.7 1.7M18.1 18.1l1.7 1.7M2.5 12h2.4M19.1 12h2.4M4.2 19.8l1.7-1.7M18.1 5.9l1.7-1.7" stroke-linecap="round" />
            </svg>
            <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
              <path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.8 6.8 0 0 0 10.5 10.5z" stroke-linejoin="round" />
            </svg>
          </button>
        </div>
      </div>
    </div>
  </header>

  <main id="main">
    <section class="not-found">
      <div>
        <p class="not-found__code" aria-hidden="true">404</p>
        <h1 class="section__title" data-i18n="notfound.title">Página no encontrada</h1>
        <p class="section__lede" style="margin-inline: auto" data-i18n="notfound.text">
          La página que buscas no existe o fue movida.
        </p>
        <div class="hero__actions" style="justify-content: center; margin-top: 2rem">
          <a class="btn btn--primary" href="index.html" data-i18n="notfound.cta">Volver al inicio</a>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer__bottom">
        <p>
          © <span class="js-footer-year">2026</span> LNX Technologies. <span data-i18n="footer.rights">Todos los derechos reservados.</span>
        </p>
      </div>
    </div>
  </footer>

  <script type="module" src="js/script.js"></script>
</body>
</html>
